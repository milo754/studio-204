<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Whisper in the Walls</title>
  <style>
    :root {
      --bg: #05070d;
      --panel: rgba(15, 18, 26, 0.86);
      --text: #e7edf8;
      --muted: #9cafc4;
      --danger: #ff4d5a;
      --gold: #f9d67a;
      --cyan: #7fe7ff;
      --wall: #1c222d;
      --shadow: rgba(0,0,0,0.6);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: radial-gradient(circle at center, #0b0e14 0%, #070a0f 35%, #030507 100%);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
    }

    .frame {
      position: relative;
      width: min(96vw, 960px);
      height: min(90vh, 640px);
      border: 2px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      overflow: hidden;
      background: #05070d;
      box-shadow:
        0 0 0 1px rgba(127,231,255,0.18),
        0 30px 80px rgba(0,0,0,0.7),
        inset 0 0 40px rgba(0,0,0,0.5);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #070b12;
      image-rendering: auto;
      cursor: crosshair;
    }

    .hud {
      position: absolute;
      left: 18px;
      top: 16px;
      z-index: 2;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 14px;
      letter-spacing: 0.04em;
      text-shadow: 0 0 12px rgba(0,0,0,0.7);
    }

    .title {
      font-weight: 700;
      color: var(--cyan);
      text-transform: uppercase;
      font-size: 12px;
      letter-spacing: 0.18em;
    }

    .status {
      color: var(--muted);
      background: rgba(8, 11, 18, 0.55);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 6px 10px;
      backdrop-filter: blur(4px);
      min-width: 210px;
    }

    .tip {
      position: absolute;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      z-index: 2;
      pointer-events: none;
      color: rgba(231, 237, 248, 0.85);
      background: rgba(9, 14, 20, 0.45);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      box-shadow: 0 0 18px rgba(0,0,0,0.35);
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: none;
      place-items: center;
      z-index: 3;
      background: rgba(3, 5, 9, 0.7);
      backdrop-filter: blur(2px);
    }

    .overlay.visible { display: grid; }

    .panel {
      background: rgba(12,16,22,0.9);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 28px 32px;
      text-align: center;
      max-width: 420px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.5);
    }
